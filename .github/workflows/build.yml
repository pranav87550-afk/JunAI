name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# BUGFIX: GITHUB_TOKEN defaults to read-only content access on this repo
# (likely reset when ownership was transferred to the new account) —
# creating a Release needs write access, causing "HTTP 403: Resource not
# accessible by integration" without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      # TEMPORARY DEBUG STEP — remove once GGUFChatEngine.kt's import is
      # fixed. Our guessed import (io.github.ljcamargo.llamacpp.LlamaHelper)
      # failed with "Unresolved reference: io", so this digs into the
      # actual downloaded AAR to find LlamaHelper's real package. Runs
      # even though the build above failed, since the AAR itself
      # downloads fine (only OUR Kotlin code fails to compile) —
      # if: always() keeps this step running regardless.
      - name: DEBUG - find llamacpp-kotlin real package name
        if: always()
        run: |
          AAR=$(find ~/.gradle/caches -ipath "*llamacpp-kotlin*" -iname "*.aar" | head -1)
          echo "AAR path: $AAR"
          if [ -n "$AAR" ]; then
            mkdir -p /tmp/aar_extract
            unzip -o "$AAR" -d /tmp/aar_extract > /dev/null
            CLASSES_JAR=$(find /tmp/aar_extract -iname "classes.jar" | head -1)
            echo "classes.jar path: $CLASSES_JAR"
            if [ -n "$CLASSES_JAR" ]; then
              echo "--- Classes matching Llama/LLMEvent ---"
              unzip -l "$CLASSES_JAR" | grep -i -E "llama|llmevent"
            fi
          else
            echo "AAR not found in Gradle cache — dependency may not have resolved."
          fi

      - name: Publish APK to a Release
        # BUGFIX: actions/upload-artifact shares a 500MB/month quota
        # with GitHub Packages on the Free plan — our APK alone (~850MB)
        # is bigger than that ENTIRE monthly allowance, so every build
        # failed the upload step regardless of how many old artifacts
        # got cleaned up first. Releases use a separate storage pool
        # (already proven working — this is exactly how the model files
        # in v1.0-models got here) with no such small shared cap, so
        # publishing there instead sidesteps the problem entirely rather
        # than just delaying it.
        #
        # Tag is fixed ("latest-build") and re-published on every run —
        # each build overwrites the previous APK asset rather than
        # creating a new release every push, so this doesn't accumulate
        # storage over time the way artifacts did.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JunAI-debug.apk
          gh release delete latest-build --repo "${{ github.repository }}" --yes || true
          gh release create latest-build JunAI-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Latest debug build" \
            --notes "Automatically built from commit ${{ github.sha }}" \
            --latest=false
