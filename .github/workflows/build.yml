name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download model files from Release v1.0-models
        # gh CLI is preinstalled on GitHub-hosted runners. GITHUB_TOKEN is
        # auto-provided by Actions and already has read access to this
        # same repo's releases (repo is private, but this is same-repo
        # access — no extra secret needed). Models aren't committed to
        # git (too big for the 25MB web-upload limit), so every build
        # pulls them fresh from the Release assets here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          gh release download v1.0-models \
            --repo "${{ github.repository }}" \
            --pattern "embeddinggemma-300M_seq1024_mixed-precision.tflite" \
            --pattern "functiongemma-270M-it.task" \
            --pattern "qwen3_0_6b_mixed_int4.litertlm" \
            --dir app/src/main/assets
          ls -la app/src/main/assets

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JunAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          compression-level: 9
